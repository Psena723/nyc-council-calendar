name: Update hearings calendar

on:
  schedule:
    - cron: "0 11 * * *"   # daily, around 7 AM New York time
  workflow_dispatch:        # lets you run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python fetch_hearings.py
      - name: Save changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add hearings.ics
          git diff --cached --quiet || (git commit -m "Update hearings" && git push)


